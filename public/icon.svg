<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Re-use makemake-icon.svg -->
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f1926" />
      <stop offset="60%" stop-color="#06090e" />
      <stop offset="100%" stop-color="#020406" />
    </radialGradient>
    <linearGradient id="obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3342" />
      <stop offset="45%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#0a0d13" />
    </linearGradient>
    <linearGradient id="pukaoRed" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff4466" />
      <stop offset="50%" stop-color="#ff1744" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="250" fill="url(#bgGlow)" stroke="#1a2536" stroke-width="4" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="14 8" opacity="0.6" />
  
  <!-- Pukao Topknot -->
  <polygon points="186,88 326,88 338,130 174,130" fill="url(#pukaoRed)" stroke="#ff7799" stroke-width="2" filter="url(#glow)" />
  <ellipse cx="256" cy="88" rx="70" ry="14" fill="#ff4466" />

  <!-- Moai Body -->
  <polygon points="184,132 328,132 334,168 316,210 322,300 306,370 312,410 286,436 226,436 200,410 206,370 190,300 196,210 178,168" fill="url(#obsidian)" stroke="#00f0ff" stroke-width="2" />
  
  <!-- Brow & Glowing Optics -->
  <polygon points="196,206 316,206 308,232 204,232" fill="#1d2634" />
  <g filter="url(#glow)">
    <rect x="218" y="244" width="22" height="6" rx="2" fill="#00f0ff" />
    <rect x="272" y="244" width="22" height="6" rx="2" fill="#00f0ff" />
  </g>
  <!-- Nose bridge & Jaw -->
  <polygon points="244,228 268,228 274,330 256,346 238,330" fill="#243142" />
  <line x1="256" y1="230" x2="256" y2="340" stroke="#00f0ff" stroke-width="2" opacity="0.8" />
  <polygon points="214,394 298,394 284,424 228,424" fill="#18212e" stroke="#ff2a6d" stroke-width="1.5" />
</svg>
