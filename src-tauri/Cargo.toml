[package]
name = "makemake"
version = "0.1.7"
description = "MakeMake // Rapa Nui Cyberpunk BitTorrent Engine"
authors = ["Abhishek Mitra (indoctrinatedrecluse)"]
license = "Apache-2.0"
repository = "https://github.com/indoctrinatedrecluse/MakeMake"
edition = "2021"

[features]
# `console` opts out of the GUI subsystem so a debug console is attached (dev only).
default = []
console = []

[lib]
name = "makemake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
log = "0.4"

# Real BitTorrent engine (DHT, trackers, peer wire protocol, piece verification).
librqbit = "9.0.1"
base64 = "0.22"

# Torrent names become directory/file names on disk: this applies Node's
# `sanitize-filename` rules (illegal characters, Windows device names, trailing dots).
sanitize-filename = "0.6"

# Tracker scrape (`/scrape` over HTTP(S), BEP-15 over UDP) for the seed/leech numbers
# librqbit does not expose. `reqwest` is already in the dependency graph *through*
# librqbit, so declaring it here adds no compilation work; the feature list must match
# librqbit's `default-tls` so Cargo does not build a second TLS stack.
reqwest = { version = "0.13", default-features = false, features = ["default-tls"] }

# Filesystem numbers: free/total space of the download volume (`statvfs` /
# `GetDiskFreeSpaceExW`) and the *allocated* size of a file, which is how a sparse
# torrent shows that it occupies a fraction of its logical length.
fs4 = "1.1"

# Windows sparse-file support for payload pre-creation (see `src/sparse.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

