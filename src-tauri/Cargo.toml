[package]
name = "makemake"
version = "0.1.0"
description = "MakeMake // Rapa Nui Cyberpunk BitTorrent Engine"
authors = ["Recluse"]
edition = "2021"

[lib]
name = "makemake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bencode = "0.2.4"
sha1 = "0.10"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
url = "2.5"
log = "0.4"
