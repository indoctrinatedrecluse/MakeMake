[package]
name = "makemake"
version = "0.1.3"
description = "MakeMake // Rapa Nui Cyberpunk BitTorrent Engine"
authors = ["Abhishek Mitra (indoctrinatedrecluse)"]
license = "Apache-2.0"
repository = "https://github.com/indoctrinatedrecluse/MakeMake"
edition = "2021"

[features]
# `console` opts out of the GUI subsystem so a debug console is attached (dev only).
default = []
console = []

[lib]
name = "makemake_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
log = "0.4"

# Real BitTorrent engine (DHT, trackers, peer wire protocol, piece verification).
librqbit = "9.0.1"
base64 = "0.22"

# Windows sparse-file support for payload pre-creation (see `src/sparse.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

