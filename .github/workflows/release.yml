name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installer & publish release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # The NSIS header/sidebar bitmaps are committed under src-tauri/installer/.
      # They are generated from public/splash-moai.mp4 with
      # `python scripts/generate-installer-art.py` (requires opencv-python).

      - name: Build & publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MakeMake ${{ github.ref_name }}'
          releaseBody: |
            MakeMake // Rapa Nui Cyberpunk BitTorrent Engine — ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for the full list of changes.

            ### Install
            1. Download the `MakeMake_*_x64-setup.exe` asset below.
            2. Run it (per-user install, no admin prompt).
            3. Launch MakeMake from the Start menu and drop in a `.torrent` file or a magnet link.
          releaseDraft: false
          prerelease: false
          args: --bundles nsis
