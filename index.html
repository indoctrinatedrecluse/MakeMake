<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/makemake-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MakeMake // Cyberpunk Swarm Engine</title>
    <!-- Cyber Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;0,800;1,400&family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Base resets and dark cyberpunk canvas */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #06090e;
        color: #e2e8f0;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* Custom Cyberpunk Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #090d14;
      }
      ::-webkit-scrollbar-thumb {
        background: #1c2638;
        border-radius: 3px;
        border: 1px solid #00f0ff33;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00f0ff88;
      }
    </style>
  </head>
  <body class="bg-obsidian-950 text-slate-100 font-mono antialiased selection:bg-cyber-cyan selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
